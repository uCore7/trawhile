name: CI/CD

on:
  push:
  pull_request:

# The entire pipeline lives in the Dagger module under ./dagger/.
# This workflow is a thin shim: it installs the Dagger CLI, then calls
# the same `ci` function developers run locally:
#
#   dagger call ci --source=.
#
# Adding stages is a code change to dagger/src/index.ts, not to this file.

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run Dagger pipeline
        uses: dagger/dagger-for-github@v6
        with:
          version: "0.21.3"
          verb: call
          args: ci --source=. --nvd-api-key=env:NVD_API_KEY
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
