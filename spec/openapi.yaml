openapi: 3.1.0
info:
  title: trawhile API
  version: 0.1.0
  description: |
    REST API surface for trawhile. Authoritative source: this document.

    Two authentication modes:
      - OIDC-authenticated browser session (cookie-based).
      - API key (Bearer token in the `Authorization` header). API keys carry a scope
        (single `(node, level)` pair) and an expiry; see SR-08-F01.

    Endpoint classification (per UR-00-C08):
      - Session-only endpoints: `/api/account/me/**` and other Account Holder operations.
      - Mixed endpoints (session OR API key): `/api/nodes/**`, `/api/tracking/**`,
        `/api/reports/**`, `/api/about`, `/api/about/openapi`.
      - Admin endpoints: session-only, require effective `admin` on the root node.
      - MCP endpoint: `/api/mcp` (API-key only). See the `mcp` tag.

    All timestamps are ISO 8601 UTC instants (UR-00-C10). User-local time-window
    semantics are the frontend's responsibility per ADR 0019; report endpoints
    accept a caller-supplied IANA TZ parameter for bucket alignment.

    Error responses follow RFC 7807 Problem Details (SR-00-C18.C01). The backend
    emits no localised text; the frontend maps stable error codes to user-facing
    strings in the active dialect.

servers:
  - url: /
    description: Same origin as the SPA.

security:
  - oidcSession: []
  - apiKey: []

tags:
  - name: account
    description: Account Holder operations on the caller's own data (session-only).
  - name: nodes
    description: Node tree read and administration.
  - name: tracking
    description: Time-record tracking and history.
  - name: reports
    description: Aggregate reports.
  - name: admin
    description: System Admin operations (effective admin on root).
  - name: about
    description: Authenticated transparency surface.
  - name: events
    description: Server-Sent Events live-update channel.
  - name: auth
    description: |
      OIDC login-flow surface exposed outside `/api/*`. Unauthenticated discovery of
      configured providers (`GET /auth/providers`) is used by the login page to
      render only the sign-in buttons backed by working backend config.
  - name: mcp
    description: |
      Model Context Protocol (per UR-00-C08 glossary). Single-endpoint Streamable HTTP
      transport for the trawhile MCP server (architecture §5.2.3), exposing the
      Work-services (`NodeService`, `TrackingService`, `ReportingService`) `@Tool`
      methods to authorized API clients. API-key auth only; session cookies rejected.

paths:

  ## Account

  /api/account/me:
    get:
      tags: [account]
      summary: Get the authenticated user's own profile (SR-05-F01.F01).
      security:
        - oidcSession: []
      responses:
        '200': { $ref: '#/components/responses/OwnProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/account/me/authorizations:
    get:
      tags: [account]
      summary: Get the authenticated user's explicit node-authorization assignments (SR-05-F04.F01).
      security:
        - oidcSession: []
      responses:
        '200': { $ref: '#/components/responses/AuthorizationsList' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/account/me/anonymise:
    post:
      tags: [account]
      summary: Self-anonymise the authenticated user (SR-05-F05.F01).
      description: |
        Requires a fresh OIDC step-up event in the session within the last 5 minutes
        (SR-05-F05.F02). On success the user-termination cleanup of SR-07-F01.F01
        runs in a single transaction; the operation is irreversible.
      security:
        - oidcSession: []
      responses:
        '204':
          description: Anonymisation complete; session terminated.
        '401':
          description: No fresh step-up event in session; redirect the user through SR-05-F05.F02 step 2.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/account/oidc-providers/link/{provider}:
    post:
      tags: [account]
      summary: Initiate OIDC provider linking flow (SR-05-F02.F01).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/ProviderRegistrationId'
      responses:
        '302':
          description: Redirect to the OIDC provider's authorization endpoint.
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/account/oidc-providers/{provider}:
    delete:
      tags: [account]
      summary: Unlink an OIDC provider from the authenticated user (SR-05-F03.F01).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/ProviderRegistrationId'
      responses:
        '204': { description: Provider unlinked. }
        '409':
          description: Unlinking would leave the user with zero linked providers.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/account/me/quick-access:
    get:
      tags: [account]
      summary: List the caller's quick-access entries (SR-03-F07.F01).
      security:
        - oidcSession: []
        - apiKey: []
      responses:
        '200':
          description: Quick-access entries in `sort_order`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuickAccessEntry' }
    post:
      tags: [account]
      summary: Add a node to the caller's quick-access list (SR-03-F07.F02).
      security:
        - oidcSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeId]
              properties:
                nodeId: { type: string, format: uuid }
      responses:
        '201': { description: Entry added. }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/account/me/quick-access/{nodeId}:
    delete:
      tags: [account]
      summary: Remove a node from the caller's quick-access list (SR-03-F07.F02).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
      responses:
        '204': { description: Entry removed. }

  /api/account/me/quick-access/order:
    put:
      tags: [account]
      summary: Reorder the caller's quick-access entries (SR-03-F07.F02).
      security:
        - oidcSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderedNodeIds]
              properties:
                orderedNodeIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Order updated. }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/account/me/api-keys:
    get:
      tags: [account]
      summary: List the caller's API keys (SR-08-F02.F01).
      security:
        - oidcSession: []
      responses:
        '200':
          description: Array of API key descriptors. Raw key value is never returned here.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
    post:
      tags: [account]
      summary: Create a new API key (SR-08-F01.F01).
      description: |
        Returns the raw key value exactly once in the response body alongside the new
        key UUID. The raw key is never recoverable afterward; only its SHA-256 hash
        is persisted.
      security:
        - oidcSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/ApiKeyCreated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/account/me/api-keys/{id}/revoke:
    post:
      tags: [account]
      summary: Revoke one of the caller's API keys (SR-08-F03.F01).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Key revoked (or already revoked — no-op success). }

  /api/account/me/webhook-subscriptions:
    get:
      tags: [account]
      summary: List the caller's webhook subscriptions (SR-03-F12.F03).
      security:
        - oidcSession: []
      responses:
        '200':
          description: Array of subscription descriptors.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookSubscription' }
    post:
      tags: [account]
      summary: Create a webhook subscription (SR-03-F12.F03).
      description: |
        Returns the raw signing secret exactly once in the response body. The raw
        secret is never recoverable afterward; only its hash is persisted.
      security:
        - oidcSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionCreateRequest' }
      responses:
        '201': { $ref: '#/components/responses/WebhookSubscriptionCreated' }

  /api/account/me/webhook-subscriptions/{id}:
    patch:
      tags: [account]
      summary: Update a webhook subscription (SR-03-F12.F03).
      description: |
        Supported updates: `endpointUrl`, `status`, and signing-secret rotation
        (`rotateSecret: true`). When `rotateSecret` is true the response carries
        the new raw secret exactly once.
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionPatchRequest' }
      responses:
        '200': { $ref: '#/components/responses/WebhookSubscriptionUpdated' }
    delete:
      tags: [account]
      summary: Revoke a webhook subscription (SR-03-F12.F03).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Subscription revoked. }

  /api/account/me/report-filters:
    get:
      tags: [account]
      summary: Get the caller's last saved report-filter state (SR-04-F07.F01).
      security:
        - oidcSession: []
      responses:
        '200':
          description: The saved filter document, or `null` if none has been saved.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ReportFilters' }
                  - { type: 'null' }
    put:
      tags: [account]
      summary: Upsert the caller's report-filter state (SR-04-F07.F02).
      security:
        - oidcSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportFilters' }
      responses:
        '204': { description: Filters saved. }

  ## Nodes

  /api/nodes/tree:
    get:
      tags: [nodes]
      summary: Return the caller's full visible node tree (SR-02-F01.F01).
      description: |
        Each node carries full attributes including the caller's effective
        authorization level. The same shape is the payload of the `NodeTreeChanged`
        snapshot SSE event (ADR 0017).
      security:
        - oidcSession: []
        - apiKey: []
      responses:
        '200':
          description: Nested tree of visible nodes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeTree' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/nodes/{parentId}/children:
    post:
      tags: [nodes]
      summary: Create a child node (SR-02-F02.F01).
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - name: parentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [displayName]
              properties:
                displayName: { type: string }
                description: { type: [string, "null"] }
                color: { type: [string, "null"] }
                icon: { type: [string, "null"] }
      responses:
        '201':
          description: The created node.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/nodes/{id}:
    patch:
      tags: [nodes]
      summary: Edit a node's attributes (SR-02-F03.F01).
      description: |
        Field omission means "no change"; explicit `null` clears the field on the
        node row. The `logo` field carries base64-encoded image bytes plus declared
        MIME type; size and MIME checks of SR-02-F03.F02 fire before persistence.
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodePatchRequest' }
      responses:
        '200':
          description: Updated node.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/nodes/{id}/children/order:
    put:
      tags: [nodes]
      summary: Reorder the direct children of a node (SR-02-F04.F01).
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderedChildIds]
              properties:
                orderedChildIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '204': { description: Order updated. }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nodes/{id}/deactivate:
    post:
      tags: [nodes]
      summary: Deactivate a node (SR-02-F05.F01).
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Node deactivated. }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nodes/{id}/reactivate:
    post:
      tags: [nodes]
      summary: Reactivate a node (SR-02-F05.F02).
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Node reactivated. }

  /api/nodes/{id}/move:
    post:
      tags: [nodes]
      summary: Move a node to a new parent (SR-02-F06.F01).
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destinationParentId]
              properties:
                destinationParentId: { type: string, format: uuid }
      responses:
        '204': { description: Node moved. }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nodes/{nodeId}/authorizations:
    get:
      tags: [nodes]
      summary: List effective authorization grants on a node (SR-02-F09.F01).
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
      responses:
        '200':
          description: Effective authorization rows on the node.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/NodeAuthorizationEntry' }
    post:
      tags: [nodes]
      summary: Grant a node-authorization to a user (SR-02-F07.F01).
      description: |
        Upserts the `(user_id, node_id)` direct grant to the requested level
        (raise, lower, or keep). Inherited grants from ancestors are not affected.
        Granting to self is forbidden by the no-self-CRUD key invariant.
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, level]
              properties:
                userId: { type: string, format: uuid }
                level: { $ref: '#/components/schemas/AuthLevel' }
      responses:
        '204': { description: Grant applied. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/nodes/{nodeId}/authorizations/{userId}:
    delete:
      tags: [nodes]
      summary: Revoke a node-authorization grant (SR-02-F08.F01).
      description: |
        Cannot revoke the caller's own grant (no-self-CRUD key invariant).
        Cannot leave the node without an effective admin (combining direct +
        inherited grants).
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/NodeIdPath'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Grant revoked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  ## Tracking

  /api/tracking/current:
    get:
      tags: [tracking]
      summary: Get the caller's currently-open time record (SR-03-F01.F01).
      security:
        - oidcSession: []
        - apiKey: []
      responses:
        '200':
          description: Current open record, or `null` if no open record exists.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/OpenTimeRecord' }
                  - { type: 'null' }

  /api/tracking/history:
    get:
      tags: [tracking]
      summary: List the caller's closed time records in descending startedAt (SR-03-F02.F01).
      security:
        - oidcSession: []
        - apiKey: []
      responses:
        '200':
          description: Array of closed time records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ClosedTimeRecord' }

  /api/tracking/start:
    post:
      tags: [tracking]
      summary: Start tracking time on a node (SR-03-F03.F01).
      security:
        - oidcSession: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartTrackingRequest' }
      responses:
        '201':
          description: New open record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenTimeRecord' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/tracking/switch:
    post:
      tags: [tracking]
      summary: Atomically stop the current record and start a new one on another node (SR-03-F05.F01).
      security:
        - oidcSession: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartTrackingRequest' }
      responses:
        '201':
          description: New open record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenTimeRecord' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/tracking/stop:
    post:
      tags: [tracking]
      summary: Stop the caller's open time record (SR-03-F06.F01).
      security:
        - oidcSession: []
        - apiKey: []
      responses:
        '204': { description: Open record closed. }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/tracking/records:
    post:
      tags: [tracking]
      summary: Create a closed (retroactive) time record (SR-03-F08.F01).
      security:
        - oidcSession: []
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateClosedRecordRequest' }
      responses:
        '201':
          description: Created closed record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClosedTimeRecord' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/tracking/records/{id}:
    patch:
      tags: [tracking]
      summary: Edit a time record owned by the caller (SR-03-F09.F01).
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimeRecordPatchRequest' }
      responses:
        '200':
          description: Updated record.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/OpenTimeRecord' }
                  - { $ref: '#/components/schemas/ClosedTimeRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [tracking]
      summary: Delete a time record owned by the caller (SR-03-F10.F01).
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Record deleted. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/tracking/records/{id}/duplicate:
    post:
      tags: [tracking]
      summary: Duplicate a time record with new timestamps (SR-03-F11.F01).
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startedAt, endedAt]
              properties:
                startedAt: { type: string, format: date-time }
                endedAt: { type: string, format: date-time }
      responses:
        '201':
          description: Duplicated record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClosedTimeRecord' }
        '409': { $ref: '#/components/responses/Conflict' }

  ## Reports

  /api/reports/aggregate:
    get:
      tags: [reports]
      summary: Aggregate time-tracking report for the caller (SR-04-F01.F01).
      description: |
        Caller-supplied `tz` is used by the backend for bucket alignment per ADR 0019.
        Period selectors (YTD, MTD, etc.) are resolved by the frontend into `from`/`to`.
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucketSize'
        - $ref: '#/components/parameters/ReportTz'
        - name: nodeId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: userId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum: [summary, detailed]
      responses:
        '200':
          description: Aggregate report rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AggregateRow' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/reports/member-summaries:
    get:
      tags: [reports]
      summary: Member time-summary report across visible peers (SR-04-F04.F01).
      security:
        - oidcSession: []
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportBucketSize'
        - $ref: '#/components/parameters/ReportTz'
        - name: nodeId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Member-summary rows.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MemberSummaryRow' }
        '400': { $ref: '#/components/responses/BadRequest' }

  ## Admin (effective admin on root, session-only)

  /api/admin/users:
    get:
      tags: [admin]
      summary: List all registered users (SR-01-F02.F01).
      security:
        - oidcSession: []
      responses:
        '200':
          description: Complete user list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminUserRow' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/admin/users/{id}/remove:
    post:
      tags: [admin]
      summary: Remove (anonymise) a user (SR-01-F06.F01).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: User removed (cleanup executed). }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/users/{id}/authorizations:
    get:
      tags: [admin]
      summary: List a user's explicit node-authorization assignments (SR-01-F07.F01).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/AuthorizationsList' }
    post:
      tags: [admin]
      summary: Grant a node-authorization on behalf of the target user (SR-01-F07.F02).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nodeId, level]
              properties:
                nodeId: { type: string, format: uuid }
                level: { $ref: '#/components/schemas/AuthLevel' }
      responses:
        '204': { description: Grant applied. }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/users/{id}/authorizations/{nodeId}:
    delete:
      tags: [admin]
      summary: Revoke a node-authorization grant on behalf of the target user (SR-01-F07.F02).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Grant revoked. }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/users/lookup:
    get:
      tags: [admin]
      summary: Look up a user by UUID, OIDC subject, or email (SR-06-F05.F01/F02/F03).
      security:
        - oidcSession: []
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: provider
          in: query
          required: false
          schema: { type: string }
        - name: subject
          in: query
          required: false
          schema: { type: string }
        - name: email
          in: query
          required: false
          schema: { type: string, format: email }
      responses:
        '200':
          description: Lookup result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLookupResponse' }
        '404':
          description: No matching user or pending invitation.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/admin/invitations:
    get:
      tags: [admin]
      summary: List pending invitations (SR-01-F03.F01).
      security:
        - oidcSession: []
      responses:
        '200':
          description: Pending invitations.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
    post:
      tags: [admin]
      summary: Create an invitation (SR-01-F04.F01).
      security:
        - oidcSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '201': { $ref: '#/components/responses/InvitationCreated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/admin/invitations/{id}:
    delete:
      tags: [admin]
      summary: Withdraw a pending invitation (SR-01-F05.F01).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Invitation withdrawn. }

  /api/admin/invitations/{id}/resend:
    post:
      tags: [admin]
      summary: Resend a pending invitation, refreshing its expiry (SR-01-F08.F01).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200': { $ref: '#/components/responses/InvitationCreated' }

  /api/admin/api-keys:
    get:
      tags: [admin]
      summary: List all API keys across all users (SR-08-F05.F01).
      security:
        - oidcSession: []
      parameters:
        - name: nameFilter
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Admin API-key view.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminApiKeyRow' }

  /api/admin/api-keys/{id}/revoke:
    post:
      tags: [admin]
      summary: Revoke any API key as admin (SR-08-F06.F01).
      security:
        - oidcSession: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204': { description: Key revoked. }

  ## About (transparency surface)

  /api/about:
    get:
      tags: [about]
      summary: About-page transparency document (SR-05-F06.F01).
      security:
        - oidcSession: []
        - apiKey: []
      responses:
        '200':
          description: Transparency document.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AboutDocument' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/about/openapi:
    get:
      tags: [about]
      summary: Download the running application's OpenAPI specification (SR-05-F06.F02).
      security:
        - oidcSession: []
        - apiKey: []
      responses:
        '200':
          description: OpenAPI YAML.
          content:
            application/yaml:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  ## Live updates (SSE)

  /api/events:
    get:
      tags: [events]
      summary: Subscribe to the caller's live-update stream (architecture §6.3).
      description: |
        Standard SSE response (`text/event-stream`). Snapshot events carry the same
        payload shape as the corresponding REST query for the recipient's visible
        slice; command events describe an action whose effect cannot be derived
        from current state (ADR 0017).
      security:
        - oidcSession: []
      responses:
        '200':
          description: SSE stream.
          content:
            text/event-stream:
              schema: { type: string }

  ## Auth

  /auth/providers:
    get:
      tags: [auth]
      summary: List configured OIDC provider registration IDs (SR-00-C02.F02).
      description: |
        Returns the registration IDs of OIDC providers configured at startup with
        a non-empty `client-id`. Used by the login page (SR-01-F13.F02) to render
        only the sign-in buttons backed by working backend config. Unauthenticated
        endpoint — does not reveal company-identifying information beyond provider
        names, per UR-00-C22.
      security: []
      responses:
        '200':
          description: Array of OIDC provider registration IDs.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  description: Spring Security OAuth2 client registration ID (e.g. `google`, `keycloak`).

  ## MCP

  /api/mcp:
    post:
      tags: [mcp]
      summary: MCP JSON-RPC 2.0 request endpoint (Streamable HTTP transport).
      description: |
        Single-endpoint Streamable HTTP transport for the trawhile MCP server
        (architecture §5.2.3, *MCP* glossary entry). Accepts MCP JSON-RPC 2.0
        request envelopes (`initialize`, `tools/list`, `tools/call`, `ping`,
        etc.); the server registers Work-services methods annotated `@Tool`
        and dispatches `tools/call` invocations to them.

        Authentication: API-key bearer ONLY (SR-00-C08.F02). OIDC session
        cookies are rejected by the security filter chain before dispatch.

        The MCP protocol payload schema is defined by the Model Context
        Protocol specification (https://modelcontextprotocol.io/) and is not
        duplicated here; this entry documents the HTTP envelope only. Clients
        signal preferred response shape via `Accept: application/json` or
        `Accept: text/event-stream` per the Streamable HTTP transport.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 request envelope per the MCP specification.
      responses:
        '200':
          description: |
            JSON-RPC 2.0 response envelope, returned either as a single JSON
            response or as a `text/event-stream` stream (Streamable HTTP
            transport — content negotiation via the request `Accept` header).
          content:
            application/json:
              schema:
                type: object
                description: JSON-RPC 2.0 response envelope per the MCP specification.
            text/event-stream:
              schema:
                type: string
                description: SSE stream of MCP messages (Streamable HTTP transport).
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [mcp]
      summary: MCP server-to-client SSE notification stream.
      description: |
        Server-Sent Events stream for server-initiated MCP notifications
        (Streamable HTTP transport). Same authentication as POST /api/mcp.
      security:
        - apiKey: []
      responses:
        '200':
          description: SSE stream of MCP notifications.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream per the MCP specification.
        '401': { $ref: '#/components/responses/Unauthorized' }

components:

  securitySchemes:
    oidcSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: Spring Session cookie (Redis-backed) issued by the OIDC callback flow.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: API_KEY
      description: API key issued via SR-08-F01.F01. Scope and expiry are pinned at creation.

  parameters:

    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

    NodeIdPath:
      name: nodeId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ProviderRegistrationId:
      name: provider
      in: path
      required: true
      schema: { type: string }
      description: Spring Security OAuth2 client registration id, as configured per SR-00-C02.F02.

    ReportFrom:
      name: from
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: UTC instant for the report period start (frontend-computed from the user-local period; ADR 0019).

    ReportTo:
      name: to
      in: query
      required: true
      schema: { type: string, format: date-time }
      description: UTC instant for the report period end.

    ReportBucketSize:
      name: bucketSize
      in: query
      required: true
      schema: { $ref: '#/components/schemas/BucketSize' }

    ReportTz:
      name: tz
      in: query
      required: true
      schema: { type: string }
      description: IANA time-zone identifier used by the backend for bucket alignment (`date_trunc(bucketSize AT TIME ZONE tz)`). Validated against `pg_timezone_names`.

  responses:

    OwnProfile:
      description: The authenticated user's profile.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OwnProfile' }

    AuthorizationsList:
      description: Explicit node-authorization assignments.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: '#/components/schemas/ExplicitAuthorization' }

    ApiKeyCreated:
      description: |
        New API key. The raw key value is returned exactly once here and never
        recoverable afterward.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ApiKey' }
              - type: object
                required: [rawKey]
                properties:
                  rawKey: { type: string, description: Opaque raw key value. }

    WebhookSubscriptionCreated:
      description: |
        New webhook subscription. The signing secret is returned exactly once.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/WebhookSubscription' }
              - type: object
                required: [signingSecret]
                properties:
                  signingSecret: { type: string }

    WebhookSubscriptionUpdated:
      description: |
        Updated webhook subscription. When the request included `rotateSecret: true`
        the response carries the new signing secret.
      content:
        application/json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/WebhookSubscription' }
              - type: object
                properties:
                  signingSecret: { type: string, description: Present only when the secret was rotated. }

    InvitationCreated:
      description: Created invitation + mailto link.
      content:
        application/json:
          schema:
            type: object
            required: [invitation, mailtoUrl]
            properties:
              invitation: { $ref: '#/components/schemas/Invitation' }
              mailtoUrl: { type: string, format: uri }

    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Unauthorized:
      description: Authentication required.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Forbidden:
      description: Caller lacks required authorization on the affected resource.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Conflict:
      description: Business rule violated (HTTP 409 with stable error code).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    PayloadTooLarge:
      description: Logo or other binary payload exceeds the documented size cap.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    UnsupportedMediaType:
      description: Declared MIME type is not one of the allowed image types.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    AuthLevel:
      type: string
      enum: [view, track, admin]

    BucketSize:
      type: string
      enum: [hour, day, week, month, year]

    Problem:
      type: object
      description: RFC 7807 Problem Details. Backend returns stable locale-neutral error codes; the frontend renders the user-facing string.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable locale-neutral error code consumed by the frontend.

    UserReference:
      type: object
      description: A user reference suitable for embedding in other responses. `displayName` and `email` are `null` for anonymised users (SR-00-C11.F02).
      required: [id]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }

    OwnProfile:
      type: object
      required: [id, displayName, email, linkedProviders, status]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        linkedProviders:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [active]

    AdminUserRow:
      type: object
      required: [id, displayName, status, providerCount, grantCount, createdAt]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        status:
          type: string
          enum: [pending, active, anonymised]
        providerCount: { type: integer }
        grantCount: { type: integer }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: [string, "null"], format: date-time }

    AdminLookupResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: [string, "null"] }
        email: { type: [string, "null"], format: email }
        status:
          type: string
          enum: [pending, active, anonymised]
        oidcProviders:
          type: array
          items:
            type: object
            required: [provider, subject]
            properties:
              provider: { type: string }
              subject: { type: string }
        authorizations:
          type: array
          items: { $ref: '#/components/schemas/ExplicitAuthorization' }

    Invitation:
      type: object
      required: [id, email, invitedAt, expiresAt, userId]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        invitedBy:
          oneOf:
            - { $ref: '#/components/schemas/UserReference' }
            - { type: "null" }
        invitedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        userId: { type: string, format: uuid, description: Pre-created users row UUID. }
        preAssignedGrantCount: { type: integer }

    Node:
      type: object
      required: [id, displayName, isActive, sortOrder, effectiveAuth]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: [string, "null"], format: uuid }
        displayName: { type: string }
        description: { type: [string, "null"] }
        color: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        logoUrl: { type: [string, "null"], description: Internal URL serving the stored logo bytes. }
        isActive: { type: boolean }
        sortOrder: { type: integer }
        deactivatedAt: { type: [string, "null"], format: date-time }
        effectiveAuth: { $ref: '#/components/schemas/AuthLevel' }

    NodeTree:
      allOf:
        - { $ref: '#/components/schemas/Node' }
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items: { $ref: '#/components/schemas/NodeTree' }

    NodePatchRequest:
      type: object
      description: Field omission means "no change"; explicit `null` clears the field (for nullable fields).
      properties:
        displayName: { type: [string, "null"] }
        description: { type: [string, "null"] }
        color: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        logo:
          oneOf:
            - type: object
              required: [data, mimeType]
              properties:
                data: { type: string, format: byte, description: Base64-encoded image bytes; decoded length ≤ 256 KB. }
                mimeType:
                  type: string
                  enum: [image/png, image/jpeg, image/svg+xml, image/webp]
            - { type: "null" }

    NodeAuthorizationEntry:
      type: object
      required: [user, level, source]
      properties:
        user: { $ref: '#/components/schemas/UserReference' }
        level: { $ref: '#/components/schemas/AuthLevel' }
        source:
          type: string
          enum: [direct, inherited]
        inheritedFromNodeId: { type: [string, "null"], format: uuid }
        inheritedFromPath:
          type: [array, "null"]
          items: { type: string }

    ExplicitAuthorization:
      type: object
      required: [nodeId, displayName, ancestorPath, level]
      properties:
        nodeId: { type: string, format: uuid }
        displayName: { type: string }
        ancestorPath:
          type: array
          items: { type: string }
        level: { $ref: '#/components/schemas/AuthLevel' }

    OpenTimeRecord:
      type: object
      required: [id, nodeId, ancestorPath, startedAt, elapsedSeconds]
      properties:
        id: { type: string, format: uuid }
        nodeId: { type: string, format: uuid }
        ancestorPath:
          type: array
          items: { type: string }
        startedAt: { type: string, format: date-time }
        elapsedSeconds: { type: integer }
        description: { type: [string, "null"] }

    ClosedTimeRecord:
      type: object
      required: [id, nodeId, ancestorPath, startedAt, endedAt, durationSeconds]
      properties:
        id: { type: string, format: uuid }
        nodeId: { type: string, format: uuid }
        ancestorPath:
          type: array
          items: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationSeconds: { type: integer }
        description: { type: [string, "null"] }

    StartTrackingRequest:
      type: object
      required: [nodeId]
      properties:
        nodeId: { type: string, format: uuid }
        description: { type: [string, "null"] }

    CreateClosedRecordRequest:
      type: object
      required: [nodeId, startedAt, endedAt]
      properties:
        nodeId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        description: { type: [string, "null"] }

    TimeRecordPatchRequest:
      type: object
      properties:
        nodeId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        description: { type: [string, "null"] }

    QuickAccessEntry:
      type: object
      required: [nodeId, displayName, ancestorPath, sortOrder, nonTrackable]
      properties:
        nodeId: { type: string, format: uuid }
        displayName: { type: string }
        ancestorPath:
          type: array
          items: { type: string }
        sortOrder: { type: integer }
        nonTrackable: { type: boolean }

    AggregateRow:
      type: object
      required: [nodeId, bucketStart, bucketEnd, durationSeconds]
      properties:
        nodeId: { type: string, format: uuid }
        nodeDisplayName: { type: [string, "null"] }
        bucketStart: { type: string, format: date-time }
        bucketEnd: { type: string, format: date-time }
        durationSeconds: { type: integer }
        description: { type: [string, "null"], description: Present only for `mode=detailed` rows. }

    MemberSummaryRow:
      type: object
      required: [user, nodeId, bucketStart, bucketEnd, durationSeconds]
      properties:
        user: { $ref: '#/components/schemas/UserReference' }
        nodeId: { type: string, format: uuid }
        nodeDisplayName: { type: string }
        ancestorPath:
          type: array
          items: { type: string }
        bucketStart: { type: string, format: date-time }
        bucketEnd: { type: string, format: date-time }
        durationSeconds: { type: integer }

    ReportFilters:
      type: object
      required: [from, to, bucketSize, tz, mode]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        bucketSize: { $ref: '#/components/schemas/BucketSize' }
        tz: { type: string }
        nodeId: { type: [string, "null"], format: uuid }
        userId: { type: [string, "null"], format: uuid }
        mode:
          type: string
          enum: [summary, detailed]

    ApiKey:
      type: object
      description: API key descriptor. Raw key never appears in this shape.
      required: [id, name, scope, createdAt, expiresAt, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        scope:
          type: object
          required: [nodeId, level]
          properties:
            nodeId: { type: string, format: uuid }
            nodeDisplayName: { type: string }
            ancestorPath:
              type: array
              items: { type: string }
            level: { $ref: '#/components/schemas/AuthLevel' }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: string, format: date-time }
        status:
          type: string
          enum: [active, expired, revoked]

    ApiKeyCreateRequest:
      type: object
      required: [name, expiresAt, scope]
      properties:
        name: { type: string, maxLength: 64 }
        expiresAt: { type: string, format: date-time, description: Must be in the future and ≤ 1 year from now (SR-08-F01.C02). }
        scope:
          type: object
          required: [nodeId, level]
          properties:
            nodeId: { type: string, format: uuid }
            level: { $ref: '#/components/schemas/AuthLevel' }

    AdminApiKeyRow:
      allOf:
        - { $ref: '#/components/schemas/ApiKey' }
        - type: object
          required: [owner]
          properties:
            owner: { $ref: '#/components/schemas/UserReference' }

    WebhookSubscription:
      type: object
      required: [id, endpointUrl, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        endpointUrl: { type: string, format: uri }
        status:
          type: string
          enum: [active, paused, revoked]
        createdAt: { type: string, format: date-time }
        rotatedAt: { type: [string, "null"], format: date-time }

    WebhookSubscriptionCreateRequest:
      type: object
      required: [endpointUrl]
      properties:
        endpointUrl: { type: string, format: uri }

    WebhookSubscriptionPatchRequest:
      type: object
      properties:
        endpointUrl: { type: string, format: uri }
        status:
          type: string
          enum: [active, paused]
        rotateSecret: { type: boolean }

    AboutDocument:
      type: object
      required: [applicationVersion, thirdPartyLicenses, personalDataSummary, outboundConnections, disclosureChannelUrl, advisoryChannelUrl, openApiDownloadUrl]
      properties:
        applicationVersion: { type: string }
        thirdPartyLicenses:
          type: array
          items:
            type: object
            required: [name, version, license]
            properties:
              name: { type: string }
              version: { type: string }
              license: { type: string }
