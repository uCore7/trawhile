spring:
  application:
    name: trawhile

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trawhile}
    username: ${SPRING_DATASOURCE_USERNAME:tt}
    password: ${SPRING_DATASOURCE_PASSWORD:dev}

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  session:
    store-type: redis
    redis:
      namespace: trawhile:session
    timeout: 12h   # SR-01-F14.F01: workday-covering inactivity timeout

  # OIDC client registrations are operator-supplied via environment variables.
  # The deployment must configure at least one registration (SR-00-C02.F01); the
  # validation in SR-01-F12.F01 fails fast at startup if none is present.
  # Example (operator sets via env or a mounted application-providers.yml):
  #
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_<id>_CLIENT_ID=...
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_<id>_CLIENT_SECRET=...
  #   SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_<id>_ISSUER_URI=https://...
  #
  # Optionally import an operator-mounted registrations file:
  config:
    import: optional:file:./config/application-providers.yml

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: native   # trust X-Forwarded-* from Caddy (UR-00-C12)

management:
  server:
    port: ${MANAGEMENT_PORT:9090}    # SR-00-C19.F01: management port distinct from public 8080
  endpoints:
    web:
      exposure:
        include: prometheus,health
  metrics:
    tags:
      application: trawhile

trawhile:
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}   # SR-01-F01.F01: first-admin bootstrap target

logging:
  level:
    com.trawhile: INFO
    org.springframework.security: INFO
